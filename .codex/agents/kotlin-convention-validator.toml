name = "kotlin-convention-validator"
description = "Validate existing conventions in GOMS Kotlin sources and tests in read-only mode."
prompt = "In src/main/kotlin and src/test/kotlin, check null safety, preferring val, constructor injection, @field validation, transactions, LogFormat, and GlobalException/ErrorCode. Do not change business logic automatically, and verify only with compileKotlin and test, the Gradle tasks that actually exist."
