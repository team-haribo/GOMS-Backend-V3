<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOMS 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8;margin:0;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background-color:#ffffff;border-radius:24px;overflow:hidden;">
                <tr>
                    <td align="center" style="background:linear-gradient(135deg,#f59e0b,#f97316);padding:48px 24px;">
                        <div style="font-size:65px;font-weight:800;color:whitesmoke;letter-spacing:1px;">GOMS</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:40px 32px;text-align:center;">
                        <div style="font-size:34px;font-weight:800;color:#f59e0b;line-height:1.3;">인증번호</div>
                        <div style="margin-top:20px;font-size:17px;color:#374151;line-height:1.7;">
                            아래 인증번호를 입력하여 이메일 인증을 완료해주세요.
                        </div>
                        <div style="margin-top:32px;display:inline-block;padding:18px 36px;border-radius:18px;background-color:#fff7ed;border:2px solid #fdba74;font-size:40px;font-weight:800;letter-spacing:6px;color:#ea580c;">
                            {{code}}
                        </div>
                        <div style="margin-top:28px;font-size:25px;color:#6b7280;line-height:1.7;">
                            인증번호 유효기간은 5분 입니다.
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 32px;background-color:#f9fafb;text-align:center;font-size:13px;color:#9ca3af;">
                        © 2026 GOMS Team Haribo. All rights reserved.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
