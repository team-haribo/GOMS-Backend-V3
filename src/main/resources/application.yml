spring:
  application:
    name: goms-server-v3

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:OFF}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BIND_LOG:OFF}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: goms-server-v3

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SPRINGDOC_OPERATIONS_SORTER:method}
    tags-sorter: ${SPRINGDOC_TAGS_SORTER:alpha}
    display-request-duration: ${SPRINGDOC_DISPLAY_REQUEST_DURATION:true}
